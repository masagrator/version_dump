@@ -23,23 +23,46 @@ jobs:
       - name: Detect and process changes
         id: process_changes
         run: |
-          git diff HEAD^ HEAD -- version_dump.txt > changes.txt
-          
-          if [ ! -s changes.txt ]; then
+          # Pick which two revisions of version_dump.txt to compare
+          if [ "${{ github.event_name }}" = "push" ] \
+             && [ -n "${{ github.event.before }}" ] \
+             && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] \
+             && git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
+            # Push: compare state before the push with state after it
+            new_rev="${{ github.sha }}"
+            old_rev="${{ github.event.before }}"
+          else
+            # workflow_dispatch (or fallback): use the last commit that changed version_dump.txt
+            new_rev=$(git log -n 1 --format=%H -- version_dump.txt)
+            old_rev="${new_rev}^"
+          fi
+          echo "Comparing version_dump.txt: $old_rev -> $new_rev"
+
+          git show "$old_rev:version_dump.txt" 2>/dev/null | tr -d '\r' > old_dump.txt || true
+          git show "$new_rev:version_dump.txt" | tr -d '\r' > new_dump.txt
+
+          # Compare by ID (first column) instead of by diff line, because the file
+          # ordering can change between commits. Output: id|rightsId|new_version|old_version
+          # (old_version = 0 if the ID did not exist before)
+          awk -F'|' '
+            NR==FNR { if (FNR > 1) old[$1] = $3; next }
+            FNR > 1 && $1 != "" {
+              o = (($1 in old) ? old[$1] : 0)
+              if (o != $3) print $1 "|" $2 "|" $3 "|" o
+            }
+          ' old_dump.txt new_dump.txt > changed_lines.txt
+
+          if [ ! -s changed_lines.txt ]; then
             echo "No changes detected"
+            echo "has_changes=false" >> $GITHUB_OUTPUT
             exit 0
           fi
